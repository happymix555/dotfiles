# Starship prompt, linked to ~/.config/starship.toml by install.sh
# Line 1: folder, git branch + status, language/env info, slow-command timer
# Line 2: ❯ (green = last command OK, red = it failed)
format = """
$directory$git_branch$git_state$git_status$python$rust$c$nodejs$cmd_duration$jobs
$character"""

add_newline = true

[directory]
truncate_to_repo = false   # always show the full path
truncation_length = 0
home_symbol = "~"
style = "bold cyan"

[git_branch]
symbol = " "
format = "on [$symbol$branch]($style) "
style = "bold purple"

[git_state]
# shows REBASING 2/5, MERGING, CHERRY-PICKING ... while one is in progress
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bold yellow"

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = "bold red"
conflicted = "=${count}"   # merge conflicts
untracked = "?${count}"    # new files git doesn't track
modified = "!${count}"     # changed, not staged
staged = "+${count}"       # staged, not committed
renamed = "»${count}"
deleted = "✘${count}"
stashed = "≡${count}"
ahead = "⇡${count}"        # commits not pushed
behind = "⇣${count}"       # commits not pulled
diverged = "⇡${ahead_count}⇣${behind_count}"

[python]
symbol = " "
format = 'via [$symbol$version( \($virtualenv\))]($style) '
style = "bold yellow"

[rust]
symbol = " "
format = "via [$symbol$version]($style) "
style = "bold red"

[c]
symbol = " "
format = "via [$symbol$version]($style) "
style = "bold blue"

[nodejs]
symbol = " "
format = "via [$symbol$version]($style) "
style = "bold green"

[cmd_duration]
min_time = 2000            # only show for commands slower than 2s
format = "took [$duration]($style) "
style = "bold yellow"

[jobs]
symbol = "✦ "              # background jobs (Ctrl+Z, &)
style = "bold blue"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
